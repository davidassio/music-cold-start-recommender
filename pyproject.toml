[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "music-cold-start-recommender"
version = "0.1.0"
description = "A music discovery and cold-start recommendation system."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17,<24",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4,<5",
    "matplotlib>=3.9,<4",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"